name: Package — Electron Builder

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_cmd: dist:win
            artifact_name: dist-windows
          - os: macos-latest
            build_cmd: dist:mac
            artifact_name: dist-macos
          - os: ubuntu-latest
            build_cmd: dist:linux
            artifact_name: dist-linux

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build main + renderer
        run: npm run build:all

      - name: Package with electron-builder
        run: npm run ${{ matrix.build_cmd }}
        env:
          # macOS notarization (optional — set in repo secrets)
          APPLE_ID:           ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD:  ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID:      ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing (optional)
          CSC_LINK:           ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD:   ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/
          retention-days: 30
