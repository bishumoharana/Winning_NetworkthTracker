name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build on all 3 platforms in parallel
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_cmd: dist:win
            artifact_name: dist-windows
          - os: macos-latest
            build_cmd: dist:mac
            artifact_name: dist-macos
          - os: ubuntu-latest
            build_cmd: dist:linux
            artifact_name: dist-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Use npm install (no lockfile committed)
      - name: Install dependencies
        run: npm install

      # Rebuild native modules (better-sqlite3) for the current Electron version
      - name: Rebuild native modules
        run: npx @electron/rebuild -f

      # Install required Linux system libraries for electron-builder
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rpm dpkg fakeroot

      # build:all is embedded in dist:win/mac/linux via package.json
      - name: Package with electron-builder
        run: npm run ${{ matrix.build_cmd }}
        env:
          NODE_ENV: production
          APPLE_ID:          ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID:     ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK:          ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD:  ${{ secrets.CSC_KEY_PASSWORD }}
          GH_TOKEN:          ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          retention-days: 7
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb

  # ---------------------------------------------------------------------------
  # 2. Create GitHub Release and attach all installer files
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for CHANGELOG)
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: release-assets/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-macos
          path: release-assets/macos

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-linux
          path: release-assets/linux

      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          BODY=$(awk "/^## \[${VERSION}\]/,/^## \[/" CHANGELOG.md \
                 | head -n -1 | tail -n +2)
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY"     >> "$GITHUB_OUTPUT"
          echo "EOF"       >> "$GITHUB_OUTPUT"

      - name: Detect pre-release
        id: prerelease
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [[ "$TAG" =~ -(beta|rc|alpha) ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ github.ref_name }}
          name:       Network Tracker ${{ github.ref_name }}
          body:       ${{ steps.changelog.outputs.body }}
          draft:      false
          prerelease: ${{ steps.prerelease.outputs.value }}
          fail_on_unmatched_files: false
          files: |
            release-assets/windows/*
            release-assets/macos/*
            release-assets/linux/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
