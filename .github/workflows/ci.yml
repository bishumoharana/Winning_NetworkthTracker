name: CI — Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # NOTE: cache: 'npm' deliberately omitted.
          # It requires a committed lockfile (package-lock.json / yarn.lock)
          # to compute the cache key. This repo has package-lock=false in
          # .npmrc so no lockfile is committed — using the cache option would
          # cause setup-node to error before npm install even runs.

      - name: Install dependencies
        run: npm install

      # Rebuild native modules (better-sqlite3) for the current Node ABI.
      # This is what allows jest.requireActual('better-sqlite3') to succeed
      # in the mock, giving tests a real in-memory SQLite instance.
      - name: Rebuild native modules for Node (test environment)
        run: npx @electron/rebuild --only better-sqlite3 --pre-gyp-fix --force --module-dir .
        # If rebuild fails (e.g. missing build tools on a runner) Jest will
        # automatically fall back to the DatabaseStub in the mock file.
        continue-on-error: true

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test -- --forceExit --testTimeout=15000 --coverage
        env:
          NODE_ENV: test
          DISPLAY: ':99'

      - name: Upload coverage (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
