appId: com.networktracker.app
productName: Network Tracker
copyright: Copyright © 2026 Network Tracker

asar: true

directories:
  buildResources: assets
  output: dist

files:
  - build/**/*
  - node_modules/**/*
  - package.json

extraMetadata:
  main: build/main/main.js

# ---------- Windows ----------
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Network Tracker
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico

# ---------- macOS ----------
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: assets/icon.icns
  category: public.app-category.utilities
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ---------- Linux ----------
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: assets/icon.png
  category: Network
  description: Real-time network traffic monitor
  maintainer: Network Tracker <noreply@networktracker.app>

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
